<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Stargazers log</h1>
      <p>A log of the repositories I've starred.</p>
      <label for="repository-search">Search repositories</label>
      <input id="repository-search" type="search" placeholder="Name or description">
      <ul id="repository-list" aria-live="polite">
        <li class="status">Loading starred repositories...</li>
      </ul>
    </main>
  </body>
</html>
